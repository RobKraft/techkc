# Once a day, pull upcoming events from Meetup and other group calendars (see
# scripts/sync-events.mjs) and open or update a pull request with anything new.
# Nothing goes live until the PR is merged.
#
# Requires: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
name: Sync events from group calendars

on:
  schedule:
    - cron: '0 12 * * *' # daily, 6 AM Central (CST) / 7 AM (CDT)
  workflow_dispatch: {}  # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/event-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull events from group calendars
        run: node scripts/sync-events.mjs
        env:
          SYNC_SUMMARY_PATH: ${{ runner.temp }}/summary.md

      - name: Add run summary to the Actions log
        run: cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- src/data/events.json; then
            echo "No new events."
            exit 0
          fi

          # Rebuild the branch from main each day so the PR always holds the full,
          # current set of new events (force-pushing replaces yesterday's version).
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/events.json
          git commit -m "Add events from group calendars ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"

          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by the daily **Sync events from group calendars** workflow. Review the events, then merge to publish or close to skip. Edit \`scripts/event-sources.json\` to skip a group or set its city."
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "New events from group calendars" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
