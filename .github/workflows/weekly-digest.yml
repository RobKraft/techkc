# Sunday evenings, email the coming week's events to everyone who signed up at
# techkc.org/subscribe (see scripts/send-digest.mjs). Sent as a Resend broadcast.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   RESEND_API_KEY, RESEND_DIGEST_SEGMENT_ID, RESEND_FROM_EMAIL
#   DIGEST_POSTAL_ADDRESS (optional; mailing address shown in the email footer)
name: Weekly events email

on:
  schedule:
    # Monday 00:00 UTC = Sunday 6 PM Central in winter (CST), 7 PM in summer (CDT).
    # GitHub may start scheduled runs some minutes late.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = send one copy to the address below; send = email every subscriber'
        type: choice
        options: [test, send]
        default: test
      test_email:
        description: 'Address for a test send'
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_DIGEST_SEGMENT_ID: ${{ secrets.RESEND_DIGEST_SEGMENT_ID }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      DIGEST_POSTAL_ADDRESS: ${{ secrets.DIGEST_POSTAL_ADDRESS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send the weekly email
        env:
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$MODE" = "send" ]; then
            node scripts/send-digest.mjs --send
          else
            node scripts/send-digest.mjs --test "$TEST_EMAIL"
          fi
