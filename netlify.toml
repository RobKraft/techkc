[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.kansascityusergroups.com/*"
  to = "https://techkc.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kansascityusergroups.com/*"
  to = "https://techkc.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
