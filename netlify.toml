[build]
  command = "npm run build"
  publish = "dist"
  # These are PUBLIC_* vars, deliberately sent to the browser (Auth0 domain,
  # client ID, and API audience — none of them are credentials). Excluded
  # from secret scanning so a documented example value in .env.example can't
  # false-positive-match the real one configured here.
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "PUBLIC_AUTH0_DOMAIN,PUBLIC_AUTH0_CLIENT_ID,PUBLIC_AUTH0_AUDIENCE"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.kansascityusergroups.com/*"
  to = "https://techkc.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://kansascityusergroups.com/*"
  to = "https://techkc.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
